server {
    listen 80;
    server_name _;
    client_max_body_size 31m;
    root /usr/share/nginx/html;
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1900s;
    }
    location / { try_files $uri $uri/ /index.html; }
}

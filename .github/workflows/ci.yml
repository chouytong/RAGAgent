name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17
        env:
          POSTGRES_USER: ragagent
          POSTGRES_PASSWORD: ragagent
          POSTGRES_DB: ragagent
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U ragagent -d ragagent"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4.2-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://ragagent:ragagent@localhost:5432/ragagent
      TEST_DATABASE_URL: postgresql+psycopg://ragagent:ragagent@localhost:5432/ragagent
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          python-version: '3.11'
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run alembic upgrade head
      - run: uv run alembic downgrade base
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - name: Configure ephemeral local authentication
        run: python scripts/ci_auth.py --compose-env .env
      - name: Record actual checkout identity for images
        run: |
          echo "RAGAGENT_SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "RAGAGENT_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up -d --build --wait --wait-timeout 300
      - run: curl --fail http://127.0.0.1:8000/api/health && curl --fail http://127.0.0.1:8080/ >/dev/null
      - run: python scripts/smoke.py
      - if: always()
        run: docker compose logs --tail=100 && docker compose down

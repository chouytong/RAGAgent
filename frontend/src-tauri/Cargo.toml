[package]
name = "scientific-ragagent-desktop"
version = "0.2.0"
description = "Local desktop UI for Scientific RAGAgent"
authors = ["Scientific RAGAgent contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["stream"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
open = "5"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
sha2 = "=0.10.9"

[profile.release]
codegen-units = 1
lto = true
strip = true
